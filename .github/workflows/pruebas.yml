# Corre las pruebas automáticas en cada subida a GitHub (ver pruebas/README.md).
# Si alguna falla, aparece una ✗ roja junto al commit. No frena la publicación de la página.
name: Pruebas automáticas
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save @electric-sql/pglite
      - run: node --test
