name: Backup diario Supabase

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Exportar datos desde Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p backups
          curl -s "$SUPABASE_URL/rest/v1/contratos?select=*&limit=10000" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -o backups/backup_contratos.json
          curl -s "$SUPABASE_URL/rest/v1/pagos?select=*&limit=50000" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -o backups/backup_pagos.json
          curl -s "$SUPABASE_URL/rest/v1/usuarios?select=*&limit=1000" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -o backups/backup_usuarios.json
          curl -s "$SUPABASE_URL/rest/v1/personas?select=*&limit=5000" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -o backups/backup_personas.json
          curl -s "$SUPABASE_URL/rest/v1/pagos_extras?select=*&limit=10000" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -o backups/backup_pagos_extras.json
          echo "Exportacion completada"

      - name: Consolidar backup
        run: |
          python3 - <<PYEOF
          import json, os, glob
          from datetime import datetime, timedelta
          fecha = datetime.now().strftime("%Y-%m-%d")
          fecha_hora = datetime.now().strftime("%Y-%m-%d %H:%M UTC")
          tables = ["contratos","pagos","usuarios","personas","pagos_extras"]
          backup = {"fecha_backup": fecha_hora, "resumen": {}, "data": {}}
          for t in tables:
              with open(f"backups/backup_{t}.json") as f:
                  data = json.load(f)
              backup["resumen"][t] = len(data)
              backup["data"][t] = data
              os.remove(f"backups/backup_{t}.json")
          filename = f"backups/backup_{fecha}.json"
          with open(filename, "w", encoding="utf-8") as f:
              json.dump(backup, f, ensure_ascii=False, default=str)
          with open("backups/ultimo_backup.json", "w", encoding="utf-8") as f:
              json.dump(backup, f, ensure_ascii=False, default=str)
          limite = datetime.now() - timedelta(days=30)
          for arch in glob.glob("backups/backup_2*.json"):
              try:
                  fecha_arch = datetime.strptime(os.path.basename(arch).replace("backup_","").replace(".json",""), "%Y-%m-%d")
                  if fecha_arch < limite:
                      os.remove(arch)
              except:
                  pass
          print(f"Backup: {backup['resumen']}")
          PYEOF

      - name: Guardar esquema SQL
        run: |
          cat > backups/esquema.sql << 'SQLEOF'
          -- ESQUEMA COMPLETO MeGa Consultora
          CREATE TABLE IF NOT EXISTS contratos (id SERIAL PRIMARY KEY, hoja TEXT, titulo TEXT, locador TEXT, locatario TEXT, vigencia_desde DATE, vigencia_hasta DATE, gastos_inicio NUMERIC, gastos_pagado NUMERIC, tipo_inmueble TEXT, modalidad_pago TEXT, periodicidad_actualizacion TEXT, indice_actualizacion TEXT, servicios_inquilino TEXT, propietario_id INTEGER, inquilino_id INTEGER, comision_porcentaje NUMERIC DEFAULT 8);
          CREATE TABLE IF NOT EXISTS pagos (id SERIAL PRIMARY KEY, hoja TEXT, mes DATE, fecha_pago_hasta DATE, corresponde_a_mes DATE, importe_alquiler NUMERIC, impuestos_servicios NUMERIC, total NUMERIC, pagado TEXT, saldo NUMERIC, comision_8 NUMERIC, pago_nro TEXT, monto_epe NUMERIC, monto_agua NUMERIC, monto_tgiu NUMERIC, monto_seguro NUMERIC, monto_otros NUMERIC, concepto_otros TEXT, descuento_propietario NUMERIC);
          CREATE TABLE IF NOT EXISTS personas (id SERIAL PRIMARY KEY, apellido TEXT, nombre TEXT, dni TEXT, cuit TEXT, domicilio TEXT, telefono TEXT, email TEXT, observaciones TEXT, created_at TIMESTAMP DEFAULT NOW());
          CREATE TABLE IF NOT EXISTS pagos_extras (id SERIAL PRIMARY KEY, pago_id INTEGER REFERENCES pagos(id) ON DELETE CASCADE, concepto TEXT, importe NUMERIC DEFAULT 0, a_cargo_de TEXT DEFAULT 'inquilino', tipo TEXT DEFAULT 'debito', created_at TIMESTAMP DEFAULT NOW());
          CREATE TABLE IF NOT EXISTS usuarios (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), email TEXT UNIQUE NOT NULL, nombre TEXT, aprobado BOOLEAN DEFAULT FALSE, admin BOOLEAN DEFAULT FALSE, rol TEXT DEFAULT 'admin', persona_id INTEGER, user_id TEXT, created_at TIMESTAMP DEFAULT NOW());
          SQLEOF
          echo "Esquema SQL guardado"

      - name: Commit y push
        run: |
          git config user.name "Backup Bot"
          git config user.email "backup@megaconsultora.com"
          git add backups/
          git diff --staged --quiet || git commit -m "Backup automatico $(date +%Y-%m-%d)"
          git push
