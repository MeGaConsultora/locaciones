<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Locaciones</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --ink2: #2d2d4e;
    --cream: #f5f0e8;
    --warm: #faf7f2;
    --accent: #c8483a;
    --accent2: #e07b30;
    --green: #2d7a4f;
    --gold: #b8860b;
    --border: #ddd8ce;
    --shadow: 0 2px 12px rgba(26,26,46,0.08);
    --shadow-lg: 0 8px 32px rgba(26,26,46,0.14);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; }

  header {
    background:var(--ink); color:var(--cream);
    padding:0 2rem; display:flex; align-items:center;
    justify-content:space-between; height:64px;
    position:sticky; top:0; z-index:100;
    box-shadow:0 2px 16px rgba(0,0,0,0.25);
  }
  .logo { font-family:'DM Serif Display',serif; font-size:1.4rem; display:flex; align-items:center; gap:10px; }
  .logo-dot { width:8px; height:8px; background:var(--accent); border-radius:50%; }
  .sync-btn {
    background:rgba(255,255,255,0.12); border:none; color:var(--cream);
    padding:6px 14px; border-radius:6px; cursor:pointer;
    font-family:'DM Sans',sans-serif; font-size:0.82rem; font-weight:500;
    display:flex; align-items:center; gap:6px; transition:background 0.2s;
  }
  .sync-btn:hover { background:rgba(255,255,255,0.22); }
  .sync-status { font-size:0.75rem; color:rgba(245,240,232,0.5); }

  nav { background:var(--ink2); display:flex; padding:0 2rem; overflow-x:auto; }
  .tab-btn {
    background:none; border:none; color:rgba(245,240,232,0.55);
    font-family:'DM Sans',sans-serif; font-size:0.85rem; font-weight:500;
    padding:0.85rem 1.3rem; cursor:pointer;
    border-bottom:2px solid transparent; white-space:nowrap; transition:all 0.2s;
  }
  .tab-btn:hover { color:var(--cream); }
  .tab-btn.active { color:var(--cream); border-bottom-color:var(--accent); }

  main { padding:2rem; max-width:1400px; margin:0 auto; }
  .panel { display:none; }
  .panel.active { display:block; }

  .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-bottom:2rem; }
  .stat-card {
    background:white; border-radius:12px; padding:1.2rem 1.4rem;
    box-shadow:var(--shadow); border-left:3px solid var(--border); transition:transform 0.2s;
  }
  .stat-card:hover { transform:translateY(-2px); }
  .stat-card.accent { border-left-color:var(--accent); }
  .stat-card.green { border-left-color:var(--green); }
  .stat-card.gold { border-left-color:var(--gold); }
  .stat-card.warn { border-left-color:var(--accent2); }
  .stat-label { font-size:0.72rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#888; margin-bottom:6px; }
  .stat-val { font-family:'DM Serif Display',serif; font-size:2rem; color:var(--ink); line-height:1; }
  .stat-sub { font-size:0.75rem; color:#999; margin-top:4px; }

  .toolbar { display:flex; gap:0.75rem; margin-bottom:1.5rem; flex-wrap:wrap; align-items:center; }
  .search-input {
    flex:1; min-width:220px; padding:0.65rem 1rem;
    border:1.5px solid var(--border); border-radius:8px;
    font-family:'DM Sans',sans-serif; font-size:0.9rem;
    background:white; color:var(--ink); transition:border-color 0.2s;
  }
  .search-input:focus { outline:none; border-color:var(--accent); }
  .filter-select {
    padding:0.65rem 1rem; border:1.5px solid var(--border); border-radius:8px;
    font-family:'DM Sans',sans-serif; font-size:0.85rem; background:white; color:var(--ink); cursor:pointer;
  }
  .btn {
    padding:0.65rem 1.2rem; border-radius:8px; border:none; cursor:pointer;
    font-family:'DM Sans',sans-serif; font-size:0.85rem; font-weight:600;
    display:flex; align-items:center; gap:6px; transition:all 0.2s; white-space:nowrap;
  }
  .btn-primary { background:var(--accent); color:white; }
  .btn-primary:hover { background:#a83828; }
  .btn-secondary { background:white; color:var(--ink); border:1.5px solid var(--border); }
  .btn-secondary:hover { border-color:var(--ink); }
  .btn-green { background:var(--green); color:white; }
  .btn-green:hover { background:#1d5a37; }
  .results-count { font-size:0.8rem; color:#999; white-space:nowrap; }

  .table-wrap { background:white; border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  thead { background:var(--ink); color:var(--cream); }
  th { padding:0.75rem 1rem; text-align:left; font-size:0.72rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; white-space:nowrap; }
  th.sortable { cursor:pointer; user-select:none; }
  th.sortable:hover { background:var(--ink2); }
  tbody tr { border-bottom:1px solid var(--border); transition:background 0.15s; cursor:pointer; }
  tbody tr:last-child { border-bottom:none; }
  tbody tr:hover { background:#faf7f2; }
  td { padding:0.75rem 1rem; font-size:0.875rem; vertical-align:middle; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }

  .badge { display:inline-block; padding:2px 10px; border-radius:100px; font-size:0.7rem; font-weight:600; letter-spacing:0.04em; }
  .badge-green { background:#d4edda; color:#155724; }
  .badge-red { background:#f8d7da; color:#721c24; }
  .badge-yellow { background:#fff3cd; color:#856404; }
  .badge-gray { background:#e9ecef; color:#495057; }
  .tag-tipo { font-size:0.72rem; padding:2px 8px; border-radius:4px; background:#f0ece4; color:#666; font-weight:500; }

  .pagination { display:flex; align-items:center; justify-content:center; gap:0.5rem; padding:1rem; border-top:1px solid var(--border); }
  .pg-btn { border:1.5px solid var(--border); background:white; color:var(--ink); width:34px; height:34px; border-radius:6px; cursor:pointer; font-size:0.85rem; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
  .pg-btn:hover { background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .pg-btn.active { background:var(--accent); color:white; border-color:var(--accent); }
  .pg-btn:disabled { opacity:0.3; cursor:default; }

  /* MODAL */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(26,26,46,0.55); z-index:200; backdrop-filter:blur(4px); align-items:center; justify-content:center; padding:1rem; }
  .modal-overlay.open { display:flex; }
  .modal { background:white; border-radius:16px; box-shadow:var(--shadow-lg); width:100%; max-width:720px; max-height:90vh; overflow-y:auto; animation:modalIn 0.22s ease; }
  @keyframes modalIn { from { opacity:0; transform:scale(0.96) translateY(10px); } to { opacity:1; transform:none; } }
  .modal-header { background:var(--ink); color:var(--cream); padding:1.4rem 1.8rem; border-radius:16px 16px 0 0; display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; }
  .modal-title { font-family:'DM Serif Display',serif; font-size:1.4rem; line-height:1.2; }
  .modal-subtitle { font-size:0.8rem; opacity:0.6; margin-top:4px; }
  .modal-close { background:rgba(255,255,255,0.15); border:none; color:var(--cream); width:32px; height:32px; border-radius:6px; cursor:pointer; font-size:1.1rem; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .modal-close:hover { background:rgba(255,255,255,0.25); }
  .modal-body { padding:1.8rem; }

  /* FORM */
  .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-bottom:1.5rem; }
  .form-group { display:flex; flex-direction:column; gap:4px; }
  .form-group label { font-size:0.72rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#888; }
  .form-group input, .form-group select, .form-group textarea {
    padding:0.6rem 0.8rem; border:1.5px solid var(--border); border-radius:8px;
    font-family:'DM Sans',sans-serif; font-size:0.88rem; color:var(--ink);
    background:white; transition:border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--accent); }
  .form-actions { display:flex; gap:0.75rem; justify-content:flex-end; padding-top:1rem; border-top:1px solid var(--border); }

  /* DETAIL */
  .detail-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; margin-bottom:1.5rem; }
  .detail-item label { font-size:0.7rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#999; display:block; margin-bottom:3px; }
  .detail-item span { font-size:0.95rem; color:var(--ink); font-weight:500; }
  .section-title { font-family:'DM Serif Display',serif; font-size:1.05rem; margin-bottom:0.75rem; padding-bottom:0.5rem; border-bottom:1.5px solid var(--border); }
  .pagos-table { width:100%; border-collapse:collapse; font-size:0.82rem; }
  .pagos-table th { background:var(--cream); padding:0.5rem 0.7rem; text-align:left; font-size:0.67rem; letter-spacing:0.06em; text-transform:uppercase; color:#666; border-bottom:1.5px solid var(--border); white-space:nowrap; }
  .pagos-table td { padding:0.5rem 0.7rem; border-bottom:1px solid #f0ece4; }
  .pagos-table tr:hover td { background:#faf7f2; }

  /* VENCIMIENTOS */
  .chip-row { display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:1rem; }
  .chip { padding:4px 12px; border-radius:100px; border:1.5px solid var(--border); background:white; font-size:0.78rem; cursor:pointer; transition:all 0.15s; font-family:'DM Sans',sans-serif; }
  .chip:hover, .chip.active { background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .venc-list { display:flex; flex-direction:column; gap:0.75rem; }
  .venc-item { background:white; border-radius:10px; padding:1rem 1.2rem; box-shadow:var(--shadow); display:flex; align-items:center; gap:1rem; cursor:pointer; transition:transform 0.15s; border-left:3px solid var(--border); }
  .venc-item:hover { transform:translateX(3px); }
  .venc-item.urgent { border-left-color:var(--accent); }
  .venc-item.soon { border-left-color:var(--accent2); }
  .venc-item.ok { border-left-color:var(--green); }
  .venc-date { font-family:'DM Serif Display',serif; font-size:1.2rem; min-width:80px; }
  .venc-info { flex:1; }
  .venc-nombre { font-weight:600; font-size:0.9rem; }
  .venc-detalle { font-size:0.78rem; color:#888; margin-top:2px; }

  .dashboard-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-top:1.5rem; }
  @media(max-width:768px) { .dashboard-grid { grid-template-columns:1fr; } }
  .chart-card { background:white; border-radius:12px; box-shadow:var(--shadow); padding:1.4rem; }
  .chart-title { font-family:'DM Serif Display',serif; font-size:1rem; margin-bottom:1rem; }
  .bar-row { display:flex; align-items:center; gap:0.75rem; margin-bottom:0.6rem; }
  .bar-label { font-size:0.78rem; width:140px; flex-shrink:0; color:#555; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-track { flex:1; background:#f0ece4; border-radius:100px; height:10px; }
  .bar-fill { height:10px; border-radius:100px; background:var(--accent); transition:width 0.5s; }
  .bar-val { font-size:0.75rem; color:#888; width:40px; text-align:right; }

  .empty-state { text-align:center; padding:3rem; color:#aaa; }
  .empty-state .icon { font-size:2.5rem; margin-bottom:0.75rem; }
  .loading-overlay { text-align:center; padding:3rem; color:#aaa; font-style:italic; }

  .saldo-pendiente { color:var(--accent); font-weight:600; }
  .saldo-ok { color:var(--green); }

  .toast { position:fixed; bottom:2rem; right:2rem; background:var(--ink); color:var(--cream); padding:0.8rem 1.4rem; border-radius:8px; font-size:0.85rem; z-index:999; animation:toastIn 0.3s ease; box-shadow:var(--shadow-lg); }
  .toast.success { border-left:3px solid var(--green); }
  .toast.error { border-left:3px solid var(--accent); }
  @keyframes toastIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

  @media(max-width:600px) { main { padding:1rem; } .stats-row { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>Gestión de Locaciones</div>
  <div style="display:flex;align-items:center;gap:1rem">
    <span class="sync-status" id="sync-status">Cargando...</span>
    <button class="sync-btn" onclick="loadAll()">↻ Actualizar</button>
  </div>
</header>

<nav>
  <button class="tab-btn active" onclick="showTab('dashboard',this)">📊 Dashboard</button>
  <button class="tab-btn" onclick="showTab('contratos',this)">📋 Contratos</button>
  <button class="tab-btn" onclick="showTab('pagos',this)">💰 Pagos</button>
  <button class="tab-btn" onclick="showTab('vencimientos',this)">📅 Vencimientos</button>
  <button class="tab-btn" onclick="showTab('pendientes',this)">⚠️ Pendientes</button>
</nav>

<main>

  <!-- DASHBOARD -->
  <div id="panel-dashboard" class="panel active">
    <div class="stats-row" id="stats-row"><div class="loading-overlay">Cargando datos...</div></div>
    <div class="dashboard-grid">
      <div class="chart-card"><div class="chart-title">Contratos por tipo de inmueble</div><div id="chart-tipos"></div></div>
      <div class="chart-card"><div class="chart-title">Próximos vencimientos (30 días)</div><div id="chart-venc"></div></div>
    </div>
  </div>

  <!-- CONTRATOS -->
  <div id="panel-contratos" class="panel">
    <div class="toolbar">
      <input class="search-input" type="text" id="search-contratos" placeholder="Buscar por nombre, locador, locatario..." oninput="renderContratos()">
      <select class="filter-select" id="filter-estado" onchange="renderContratos()">
        <option value="">Todos los estados</option>
        <option value="vigente">Vigentes</option>
        <option value="vencido">Vencidos</option>
      </select>
      <select class="filter-select" id="filter-tipo" onchange="renderContratos()">
        <option value="">Todos los tipos</option>
      </select>
      <button class="btn btn-primary" onclick="openNuevoContrato()">+ Nuevo contrato</button>
      <span class="results-count" id="count-contratos"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th class="sortable" onclick="sortBy('contratos','titulo')">Contrato</th>
          <th>Locador</th><th>Locatario</th>
          <th class="sortable" onclick="sortBy('contratos','vigencia_hasta')">Vence</th>
          <th>Tipo</th><th>Estado</th>
        </tr></thead>
        <tbody id="tbody-contratos"></tbody>
      </table>
      <div class="pagination" id="pg-contratos"></div>
    </div>
  </div>

  <!-- PAGOS -->
  <div id="panel-pagos" class="panel">
    <div class="toolbar">
      <input class="search-input" type="text" id="search-pagos" placeholder="Buscar contrato..." oninput="renderPagos()">
      <select class="filter-select" id="filter-pagado" onchange="renderPagos()">
        <option value="">Todos</option>
        <option value="pendiente">Pendientes</option>
        <option value="pagado">Pagados</option>
      </select>
      <select class="filter-select" id="filter-anio" onchange="renderPagos()">
        <option value="">Todos los años</option>
      </select>
      <span class="results-count" id="count-pagos"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Contrato</th>
          <th class="sortable" onclick="sortBy('pagos','mes')">Mes</th>
          <th>Vence</th>
          <th class="num">Alquiler</th>
          <th class="num">Impuestos</th>
          <th class="num">Total</th>
          <th class="num">Saldo</th>
          <th>Estado</th>
        </tr></thead>
        <tbody id="tbody-pagos"></tbody>
      </table>
      <div class="pagination" id="pg-pagos"></div>
    </div>
  </div>

  <!-- VENCIMIENTOS -->
  <div id="panel-vencimientos" class="panel">
    <div class="chip-row">
      <button class="chip active" onclick="setVencFiltro('30',this)">30 días</button>
      <button class="chip" onclick="setVencFiltro('60',this)">60 días</button>
      <button class="chip" onclick="setVencFiltro('90',this)">90 días</button>
      <button class="chip" onclick="setVencFiltro('vencidos',this)">Ya vencidos</button>
      <button class="chip" onclick="setVencFiltro('todos',this)">Todos</button>
    </div>
    <div id="venc-list" class="venc-list"></div>
  </div>

  <!-- PENDIENTES -->
  <div id="panel-pendientes" class="panel">
    <div class="stats-row" id="stats-pendientes"></div>
    <div class="toolbar">
      <input class="search-input" type="text" id="search-pendientes" placeholder="Buscar contrato..." oninput="renderPendientes()">
      <span class="results-count" id="count-pendientes"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Contrato</th><th>Mes</th><th>Locatario</th>
          <th class="num">Importe</th><th class="num">Saldo</th><th>Pago Nº</th>
        </tr></thead>
        <tbody id="tbody-pendientes"></tbody>
      </table>
      <div class="pagination" id="pg-pendientes"></div>
    </div>
  </div>

</main>

<!-- MODAL DETALLE / EDICION -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div><div class="modal-title" id="modal-title"></div><div class="modal-subtitle" id="modal-subtitle"></div></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
// ============================================================
// CONFIG SUPABASE
// ============================================================
const SB_URL = 'https://hpufcseedvdmcoamundr.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhwdWZjc2VlZHZkbWNvYW11bmRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMjU5NTQsImV4cCI6MjA5MzYwMTk1NH0.x91y_KKcuqM3CXCNTsMxTmJvi8HIm4SsxxNKUaX12d0';
const TODAY = new Date().toISOString().split('T')[0];

const HEADERS = {
  'apikey': SB_KEY,
  'Authorization': `Bearer ${SB_KEY}`,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

async function sbGet(table, params='') {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, { headers: HEADERS });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPost(table, body) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, { method:'POST', headers: HEADERS, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPatch(table, id, body) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`, { method:'PATCH', headers: HEADERS, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDelete(table, id) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`, { method:'DELETE', headers: HEADERS });
  if (!r.ok) throw new Error(await r.text());
}

// ============================================================
// STATE
// ============================================================
let DB = { contratos: [], pagos: [] };
const PG = { contratos:1, pagos:1, pendientes:1 };
const PER_PAGE = 25;
let sortState = { contratos:{col:'titulo',dir:'asc'}, pagos:{col:'mes',dir:'desc'} };
let vencFiltro = '30';

// ============================================================
// LOAD DATA
// ============================================================
async function loadAll() {
  document.getElementById('sync-status').textContent = 'Actualizando...';
  try {
    const [contratos, pagos] = await Promise.all([
      sbGet('contratos', 'select=*&order=titulo.asc&limit=1000'),
      sbGet('pagos', 'select=*&order=mes.desc&limit=10000')
    ]);
    DB.contratos = contratos;
    DB.pagos = pagos;
    document.getElementById('sync-status').textContent = `Actualizado ${new Date().toLocaleTimeString('es-AR')}`;
    populateFiltros();
    renderDashboard();
    renderContratos();
    renderPagos();
    renderVencimientos();
    renderPendientes();
  } catch(e) {
    document.getElementById('sync-status').textContent = 'Error de conexión';
    toast('Error al conectar con la base de datos', 'error');
  }
}

// ============================================================
// HELPERS
// ============================================================
function formatDate(d) {
  if (!d) return '—';
  const [y,m,day] = d.substring(0,10).split('-');
  const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${parseInt(day)} ${months[parseInt(m)-1]} ${y}`;
}
function formatMoney(n) {
  if (n == null || isNaN(n)) return '—';
  return '$ ' + Math.round(n).toLocaleString('es-AR');
}
function normTipo(t) {
  if (!t || t==='nan') return 'Otro';
  const l = t.toLowerCase().trim();
  if (l.includes('casa')||l.includes('vivienda')||l.includes('urbano')||l.includes('habitaci')) return 'Casa/Habitación';
  if (l.includes('dpto')||l.includes('departamento')) return 'Departamento';
  if (l.includes('local')||l.includes('comercial')) return 'Local Comercial';
  if (l.includes('galp')||l.includes('depósito')||l.includes('deposito')||l.includes('taller')||l.includes('predio')) return 'Galpón/Depósito';
  if (l.includes('cochera')||l.includes('garaje')) return 'Cochera/Garaje';
  if (l.includes('consultorio')) return 'Consultorio';
  return t;
}
function getEstado(c) {
  if (!c.vigencia_hasta) return 'indefinido';
  return c.vigencia_hasta >= TODAY ? 'vigente' : 'vencido';
}
function daysDiff(d1, d2) {
  return Math.round((new Date(d1) - new Date(d2)) / 86400000);
}
function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function renderDashboard() {
  const vigentes = DB.contratos.filter(c => getEstado(c)==='vigente').length;
  const vencidos = DB.contratos.filter(c => getEstado(c)==='vencido').length;
  const pendientes = DB.pagos.filter(p => p.saldo && p.saldo > 0);
  const totalPendiente = pendientes.reduce((s,p) => s+(p.saldo||0), 0);
  const proxVenc = DB.contratos.filter(c => { if(!c.vigencia_hasta) return false; const d=daysDiff(c.vigencia_hasta,TODAY); return d>=0&&d<=60; }).length;

  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card green"><div class="stat-label">Contratos vigentes</div><div class="stat-val">${vigentes}</div><div class="stat-sub">de ${DB.contratos.length} totales</div></div>
    <div class="stat-card accent"><div class="stat-label">Vencidos</div><div class="stat-val">${vencidos}</div><div class="stat-sub">contratos finalizados</div></div>
    <div class="stat-card warn"><div class="stat-label">Vencen en 60 días</div><div class="stat-val">${proxVenc}</div><div class="stat-sub">requieren atención</div></div>
    <div class="stat-card gold"><div class="stat-label">Saldo pendiente</div><div class="stat-val" style="font-size:1.3rem">${formatMoney(totalPendiente)}</div><div class="stat-sub">${pendientes.length} cuotas sin cobrar</div></div>
  `;

  const tiposMap = {};
  DB.contratos.forEach(c => { const t=normTipo(c.tipo_inmueble); tiposMap[t]=(tiposMap[t]||0)+1; });
  const tiposSorted = Object.entries(tiposMap).sort((a,b)=>b[1]-a[1]);
  const maxT = tiposSorted[0]?.[1]||1;
  document.getElementById('chart-tipos').innerHTML = tiposSorted.map(([t,n]) =>
    `<div class="bar-row"><div class="bar-label" title="${t}">${t}</div><div class="bar-track"><div class="bar-fill" style="width:${(n/maxT*100).toFixed(1)}%"></div></div><div class="bar-val">${n}</div></div>`
  ).join('');

  const vencList = DB.contratos.filter(c => { if(!c.vigencia_hasta) return false; const d=daysDiff(c.vigencia_hasta,TODAY); return d>=-30&&d<=30; }).sort((a,b)=>a.vigencia_hasta.localeCompare(b.vigencia_hasta)).slice(0,8);
  document.getElementById('chart-venc').innerHTML = vencList.length === 0
    ? '<div class="empty-state"><p>Sin vencimientos próximos</p></div>'
    : vencList.map(c => {
        const d = daysDiff(c.vigencia_hasta, TODAY);
        const cls = d<0?'badge-gray':d<=15?'badge-red':d<=30?'badge-yellow':'badge-green';
        const txt = d<0?`Venció hace ${-d}d`:d===0?'Hoy':`En ${d}d`;
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid #f0ece4;cursor:pointer" onclick="openContrato(${c.id})">
          <span style="font-size:0.82rem;flex:1">${c.titulo}</span>
          <span class="badge ${cls}">${txt}</span>
        </div>`;
      }).join('');
}

let contratosFiltrados = [];

function renderContratos() {
  const q = document.getElementById('search-contratos').value.toLowerCase();
  const estado = document.getElementById('filter-estado').value;
  const tipo = document.getElementById('filter-tipo').value;

  contratosFiltrados = DB.contratos.filter(c => {
    if (q && !c.titulo?.toLowerCase().includes(q) && !c.locador?.toLowerCase().includes(q) && !c.locatario?.toLowerCase().includes(q)) return false;
    if (estado && getEstado(c) !== estado) return false;
    if (tipo && normTipo(c.tipo_inmueble) !== tipo) return false;
    return true;
  });

  const {col,dir} = sortState.contratos;
  contratosFiltrados.sort((a,b) => { const va=(a[col]||'').toString(); const vb=(b[col]||'').toString(); return dir==='asc'?va.localeCompare(vb):vb.localeCompare(va); });

  document.getElementById('count-contratos').textContent = `${contratosFiltrados.length} resultado${contratosFiltrados.length!==1?'s':''}`;
  const slice = contratosFiltrados.slice((PG.contratos-1)*PER_PAGE, PG.contratos*PER_PAGE);

  document.getElementById('tbody-contratos').innerHTML = slice.length === 0
    ? `<tr><td colspan="6"><div class="empty-state"><div class="icon">🔍</div><p>Sin resultados</p></div></td></tr>`
    : slice.map(c => {
        const est = getEstado(c);
        const d = c.vigencia_hasta ? daysDiff(c.vigencia_hasta, TODAY) : null;
        const alerta = d!==null&&d>=0&&d<=30 ? `<span class="badge badge-yellow" style="margin-left:4px">⚠ ${d}d</span>` : '';
        return `<tr onclick="openContrato(${c.id})">
          <td><strong>${c.titulo||c.hoja}</strong></td>
          <td>${c.locador||'—'}</td><td>${c.locatario||'—'}</td>
          <td>${formatDate(c.vigencia_hasta)}${alerta}</td>
          <td><span class="tag-tipo">${normTipo(c.tipo_inmueble)}</span></td>
          <td><span class="badge ${est==='vigente'?'badge-green':'badge-gray'}">${est}</span></td>
        </tr>`;
      }).join('');

  renderPagination('pg-contratos', contratosFiltrados.length, PG.contratos, n => { PG.contratos=n; renderContratos(); });
}

function sortBy(table, col) {
  if (sortState[table].col===col) sortState[table].dir = sortState[table].dir==='asc'?'desc':'asc';
  else { sortState[table].col=col; sortState[table].dir='asc'; }
  PG[table]=1;
  table==='contratos'?renderContratos():renderPagos();
}

let pagosFiltrados = [];

function renderPagos() {
  const q = document.getElementById('search-pagos').value.toLowerCase();
  const pagado = document.getElementById('filter-pagado').value;
  const anio = document.getElementById('filter-anio').value;

  pagosFiltrados = DB.pagos.filter(p => {
    if (q && !p.hoja?.toLowerCase().includes(q)) return false;
    if (anio && !p.mes?.startsWith(anio)) return false;
    if (pagado==='pendiente' && !(p.saldo&&p.saldo>0)) return false;
    if (pagado==='pagado' && (p.saldo&&p.saldo>0)) return false;
    return true;
  });

  const {col,dir} = sortState.pagos;
  pagosFiltrados.sort((a,b) => { const va=(a[col]||'').toString(); const vb=(b[col]||'').toString(); return dir==='asc'?va.localeCompare(vb):vb.localeCompare(va); });

  document.getElementById('count-pagos').textContent = `${pagosFiltrados.length} registro${pagosFiltrados.length!==1?'s':''}`;
  const slice = pagosFiltrados.slice((PG.pagos-1)*PER_PAGE, PG.pagos*PER_PAGE);

    ? `<tr><td colspan="8"><div class="empty-state"><div class="icon">💳</div><p>Sin registros</p></div></td></tr>`

function setVencFiltro(v, btn) {
  vencFiltro = v;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderVencimientos();
}

function renderVencimientos() {
  let lista = DB.contratos.filter(c => c.vigencia_hasta);
  if (vencFiltro==='vencidos') lista = lista.filter(c => c.vigencia_hasta<TODAY);
  else if (vencFiltro!=='todos') { const d=parseInt(vencFiltro); lista=lista.filter(c => { const dd=daysDiff(c.vigencia_hasta,TODAY); return dd>=0&&dd<=d; }); }
  lista.sort((a,b) => a.vigencia_hasta.localeCompare(b.vigencia_hasta));

  const el = document.getElementById('venc-list');
  if (lista.length===0) { el.innerHTML=`<div class="empty-state"><div class="icon">📅</div><p>Sin vencimientos en este período</p></div>`; return; }
  el.innerHTML = lista.map(c => {
    const d = daysDiff(c.vigencia_hasta, TODAY);
    const cls = d<0?'':d<=15?'urgent':d<=30?'soon':'ok';
    const dtext = d<0?`Venció hace ${-d} días`:d===0?'¡Vence hoy!':`Vence en ${d} días`;
    const lastPago = DB.pagos.filter(p=>p.hoja===c.hoja).slice(-1)[0];
    return `<div class="venc-item ${cls}" onclick="openContrato(${c.id})">
      <div class="venc-date">${formatDate(c.vigencia_hasta)}</div>
      <div class="venc-info">
        <div class="venc-nombre">${c.titulo}</div>
        <div class="venc-detalle">${c.locatario||''} · ${normTipo(c.tipo_inmueble)}</div>
        <div class="venc-detalle" style="color:${d<0?'#999':d<=15?'var(--accent)':d<=30?'var(--accent2)':'var(--green)'}">${dtext}</div>
      </div>
      ${lastPago?`<div style="font-weight:600;font-size:0.9rem;text-align:right">${formatMoney(lastPago.importe_alquiler)}<div style="font-size:0.72rem;color:#aaa;font-weight:400">último alquiler</div></div>`:''}
    </div>`;
  }).join('');
}

      <button class="btn btn-secondary" onclick="openContrato(${id})">← Volver</button>
      <button class="btn btn-primary" onclick="actualizarContrato(${id})">Guardar cambios</button>
    </div>
  `;
}

async function actualizarContrato(id) {
  const body = {
    titulo: document.getElementById('f-titulo').value.trim(),
    locador: document.getElementById('f-locador').value.trim(),
    locatario: document.getElementById('f-locatario').value.trim(),
    vigencia_desde: document.getElementById('f-desde').value||null,
    vigencia_hasta: document.getElementById('f-hasta').value||null,
    tipo_inmueble: document.getElementById('f-tipo').value,
    modalidad_pago: document.getElementById('f-modalidad').value,
  };
  try {
    await sbPatch('contratos', id, body);
    toast('Contrato actualizado ✓');
    await loadAll();
    openContrato(id);
  } catch(e) { toast('Error: '+e.message,'error'); }
}

// ============================================================
// REGISTRAR PAGO - NUEVO FLUJO
// ============================================================
async function openNuevoPago(hoja) {
  const contrato = DB.contratos.find(c => c.hoja === hoja);
  document.getElementById('modal-title').textContent = 'Registrar Pago';
  document.getElementById('modal-subtitle').textContent = hoja;
  document.getElementById('modal-body').innerHTML = `<div class="loading-overlay">Cargando meses impagos...</div>`;
  document.getElementById('modal-overlay').classList.add('open');

  try {
    const hojaEncoded = encodeURIComponent(hoja);
    const pagos = await sbGet('pagos', `hoja=eq.${hojaEncoded}&order=mes.asc&limit=500`);
    const impagos = pagos.filter(p => p.saldo && p.saldo > 0);

    if (impagos.length === 0) {
      document.getElementById('modal-body').innerHTML = `
        <div class="empty-state"><div class="icon">✅</div><p>No hay meses con saldo pendiente para este contrato.</p></div>
        <div class="form-actions"><button class="btn btn-secondary" onclick="closeModal()">Cerrar</button></div>
      `;
      return;
    }

    // Calcular nro de mes para cada pago (posición en lista total de pagos)
    const todosPagos = pagos;

    document.getElementById('modal-body').innerHTML = `
      <div class="form-group" style="margin-bottom:1.2rem">
        <label>Seleccioná el mes a pagar</label>
        <select id="sel-mes-impago" class="filter-select" style="width:100%;margin-top:4px" onchange="cargarItemsPago(${JSON.stringify(impagos).replace(/"/g,'&quot;')}, this.value, ${JSON.stringify(todosPagos).replace(/"/g,'&quot;')})">
          <option value="">-- Elegí un mes --</option>
          ${impagos.map((p,i) => {
            const nroMes = todosPagos.findIndex(x => x.id === p.id) + 1;
            return `<option value="${p.id}">Mes ${nroMes} — ${formatDate(p.mes)} — Saldo: ${formatMoney(p.saldo)}</option>`;
          }).join('')}
        </select>
      </div>
      <div id="items-pago"></div>
    `;
  } catch(e) {
    document.getElementById('modal-body').innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`;
  }
}

function cargarItemsPago(impagos, pagoId, todosPagos) {
  if (!pagoId) { document.getElementById('items-pago').innerHTML = ''; return; }
  const pago = impagos.find(p => p.id == pagoId);
  if (!pago) return;
  const nroMes = todosPagos.findIndex(x => x.id == pagoId) + 1;

  const items = [
    { id:'alquiler', label:'Alquiler', val: pago.importe_alquiler },
    { id:'epe',      label:'EPE',      val: pago.monto_epe },
    { id:'agua',     label:'Agua',     val: pago.monto_agua },
    { id:'tgiu',     label:'TGIU',     val: pago.monto_tgiu },
    { id:'impuestos',label:'Otros Impuestos/Servicios', val: pago.impuestos_servicios },
    { id:'comision', label:'Comisión 8%', val: pago.comision_8 },
  ].filter(it => it.val && it.val > 0);

  document.getElementById('items-pago').innerHTML = `
    <div class="section-title" style="margin-bottom:1rem">Mes ${nroMes} — ${formatDate(pago.mes)}</div>
    <p style="font-size:0.82rem;color:#888;margin-bottom:1rem">Marcá los ítems que abona en este momento:</p>
    <div style="background:var(--cream);border-radius:10px;padding:1rem;margin-bottom:1rem">
      ${items.map(it => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid var(--border)">
          <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:0.9rem">
            <input type="checkbox" id="chk-${it.id}" value="${it.val}" checked
              style="width:16px;height:16px;cursor:pointer"
              onchange="recalcularTotal()">
            ${it.label}
          </label>
          <span style="font-weight:600">${formatMoney(it.val)}</span>
        </div>
      `).join('')}
      <div style="display:flex;justify-content:space-between;padding:0.75rem 0 0;font-weight:700;font-size:1rem">
        <span>Total a cobrar:</span>
        <span id="total-cobrar" style="color:var(--green)">$ 0</span>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:1rem">
      <label>Fecha de pago</label>
      <input id="p-fecha" type="date" value="${TODAY}" style="margin-top:4px">
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-green" onclick="confirmarPago(${pago.id}, '${pago.hoja}', ${nroMes})">Guardar y generar recibo</button>
    </div>
  `;
  recalcularTotal();
}

function recalcularTotal() {
  const checks = document.querySelectorAll('[id^="chk-"]');
  let total = 0;
  checks.forEach(c => { if (c.checked) total += parseFloat(c.value)||0; });
  const el = document.getElementById('total-cobrar');
  if (el) el.textContent = formatMoney(total);
}

async function confirmarPago(pagoId, hoja, nroMes) {
  const checks = document.querySelectorAll('[id^="chk-"]');
  let totalAbonado = 0;
  const itemsAbonados = [];
  checks.forEach(c => {
    if (c.checked) {
      totalAbonado += parseFloat(c.value)||0;
      itemsAbonados.push({ label: c.closest('div').querySelector('label').textContent.trim(), monto: parseFloat(c.value) });
    }
  });

  if (totalAbonado === 0) { toast('Seleccioná al menos un ítem','error'); return; }

  const fechaPago = document.getElementById('p-fecha').value;
  const contrato = DB.contratos.find(c => c.hoja === hoja);

  // Traer pago actual para calcular nuevo saldo
  try {
    const hojaEncoded = encodeURIComponent(hoja);
    const pagos = await sbGet('pagos', `hoja=eq.${hojaEncoded}&order=mes.asc&limit=500`);
    const pagoActual = pagos.find(p => p.id == pagoId);
    const nuevoSaldo = Math.max(0, (pagoActual.saldo||0) - totalAbonado);

    // Actualizar saldo en Supabase
    await sbPatch('pagos', pagoId, {
      saldo: nuevoSaldo,
      pagado: nuevoSaldo === 0 ? 'SI' : 'PARCIAL',
      pago_nro: String(nroMes)
    });

    toast('Pago registrado ✓');

    // Generar recibo
    imprimirRecibo({
      contrato,
      nroMes,
      mes: pagoActual.mes,
      fechaPago,
      itemsAbonados,
      totalAbonado,
      nuevoSaldo
    });

    closeModal();
    await loadAll();
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  }
}

      ${data.nuevoSaldo > 0 ? `<div style="background:#fff3cd;border-radius:6px;padding:8px 12px;font-size:0.82rem;color:#856404;margin-bottom:12px">⚠ Saldo pendiente: <strong>${formatMoney(data.nuevoSaldo)}</strong></div>` : '<div style="background:#d4edda;border-radius:6px;padding:8px 12px;font-size:0.82rem;color:#155724;margin-bottom:12px">✓ Mes cancelado en su totalidad</div>'}

// ============================================================
// PAGINATION
// ============================================================
function renderPagination(containerId, total, current, cb) {
  const pages = Math.ceil(total/PER_PAGE);
  const el = document.getElementById(containerId);
  if (pages<=1) { el.innerHTML=''; return; }
  let html = `<button class="pg-btn" onclick="(${cb.toString()})(${current-1})" ${current===1?'disabled':''}>‹</button>`;
  let start=Math.max(1,current-2), end=Math.min(pages,current+2);
  if (start>1) html+=`<button class="pg-btn" onclick="(${cb.toString()})(1)">1</button>${start>2?'<span style="padding:0 4px">…</span>':''}`;
  for (let i=start;i<=end;i++) html+=`<button class="pg-btn ${i===current?'active':''}" onclick="(${cb.toString()})(${i})">${i}</button>`;
  if (end<pages) html+=`${end<pages-1?'<span style="padding:0 4px">…</span>':''}<button class="pg-btn" onclick="(${cb.toString()})(${pages})">${pages}</button>`;
  html+=`<button class="pg-btn" onclick="(${cb.toString()})(${current+1})" ${current===pages?'disabled':''}>›</button>`;
  el.innerHTML = html;
}

// ============================================================
// MODAL
// ============================================================
function closeModal(e) {
  if (!e || e.target===document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}

// ============================================================
// TABS
// ============================================================
function showTab(name, btn) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  btn.classList.add('active');
}
